<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<title>Vishnu Lamp</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#000; font:14px/1.4 system-ui; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:10px 12px; 
        background:linear-gradient(180deg,transparent,rgba(0,0,0,.75)); }
  #bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, label, input[type="range"] { font:inherit; }
  button { background:#111; color:#eee; border:1px solid #333; border-radius:10px; padding:8px 10px; }
  .pill { background:#111; border:1px solid #333; border-radius:10px; padding:6px 10px; color:#ddd; }
  .grp { display:flex; gap:8px; align-items:center; }
  input[type="file"] { display:none; }
  .slider { width:160px; }
  #hud { position:fixed; left:12px; top:10px; color:#eee; }
</style>

<div id="stage">
  <video id="cam" playsinline autoplay muted></video>
  <canvas id="view"></canvas>
</div>

<div id="hud" class="pill">mode: <b id="mode">LIVE</b> · u:0° v:+ slice:0</div>

<div id="ui">
  <div id="bar">
    <button id="toggle">Use Planet Image</button>
    <label class="pill">
      <input id="file" type="file" accept="image/*">
      Load Image
    </label>
    <span class="pill">Polarizer <input id="pol" class="slider" type="range" min="0" max="180" value="0"> <span id="polv">0°</span></span>
    <span class="pill grp">
      θ <input id="theta" class="slider" type="range" min="-25" max="25" value="0"> <span id="thetav">0°</span>
    </span>
    <span class="pill grp">
      ϕ <input id="phi" class="slider" type="range" min="-25" max="25" value="0"> <span id="phiv">0°</span>
    </span>
    <button id="reset">Reset Slice</button>
  </div>
</div>

<script src="main.js"></script>
